# Jetson Controller Configuration — BENCH (candle/candleLight adapter)
#
# Copy of controller.yaml with CAN interface set to "candle" for the
# canable2 running candleLight (gs_usb) firmware on the macOS bench.
# Pass with: --config <this file>. Does NOT replace controller.yaml.
#
# Joint topology and limits are loaded from joint_config.json
# (auto-generated from firmware config_presets.h).

can:
  interface: candle
  channel: auto                            # "auto" = detect candle device (gs_usb/candleLight)
  bitrate: 500000                         # Host CAN default baseline

startup:
  pretension_all: false                    # Match webapp startup path by default
  recovery_settle_s: 30.0                 # After E-stop recovery, hold current pose before READY

impedance:
  send_rate_hz: 50
  watchdog_ms: 2000       # Impedance watchdog timeout (firmware fallback to HOLDING)

homing:
  speed_deg_s: 5.0        # Slow and safe for homing
  tolerance_deg: 1.0      # Convergence threshold for homing complete

nudge:
  speed_deg_s: 15.0       # Degrees/second for +/- nudge commands

default_joint: knee_right

joints:
  knee_right:
    gains:
      outer: { kp: 8.0, ki: 8.0, kd: 0.08 }
      inner: { kp: 10.0, ki: 1.0, kd: 0.25 }
    stiffness_deg: 25.0
    home_position_deg:
      0: 0.0              # flexion-extension

  ankle_right:
    gains:
      outer: { kp: 8.0, ki: 8.0, kd: 0.08 }
      inner: { kp: 10.0, ki: 1.0, kd: 0.25 }
    stiffness_deg: 25.0
    home_position_deg:
      0: 0.0              # plantar-dorsal
      1: 0.0              # inversion-eversion

  hip_right:
    gains:
      outer: { kp: 8.0, ki: 8.0, kd: 0.08 }
      inner: { kp: 10.0, ki: 1.0, kd: 0.25 }
    stiffness_deg: 25.0
    dof_overrides:
      2:
        gains:
          inner: { kp: 60.0, ki: 50.0, kd: 1.0 }
    home_position_deg:
      0: 0.0              # flexion-extension
      1: 0.0              # abduction-adduction
      2: 0.0              # axial-roll

  hip_left:
    gains:
      outer: { kp: 8.0, ki: 8.0, kd: 0.08 }
      inner: { kp: 10.0, ki: 1.0, kd: 0.25 }
    stiffness_deg: 25.0
    dof_overrides:
      2:
        gains:
          inner: { kp: 60.0, ki: 50.0, kd: 1.0 }
    home_position_deg:
      0: 0.0              # flexion-extension
      1: 0.0              # abduction-adduction
      2: 0.0              # axial-roll

  hip_roll_bench_right:
    gains:
      outer: { kp: 8.0, ki: 8.0, kd: 0.08 }
      inner: { kp: 60.0, ki: 50.0, kd: 1.0 }
    stiffness_deg: 25.0
    home_position_deg:
      0: 0.0              # axial-roll

  hip_roll_bench_left:
    gains:
      outer: { kp: 8.0, ki: 8.0, kd: 0.08 }
      inner: { kp: 60.0, ki: 50.0, kd: 1.0 }
    stiffness_deg: 25.0
    home_position_deg:
      0: 0.0              # axial-roll
