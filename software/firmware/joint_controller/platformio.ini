; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = pico2_debug

[env:pico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
lib_deps = mcp_can@1.5.1
;debug_tool = cmsis-dap
monitor_speed = 115200
custom_flash_link_target = runtime
build_src_filter =
    +<*>
    -<boot_update/>
build_flags =
    -DCONTROLLER_DEBUG=0
    -DLOG_LEVEL=2
    -DFW_LINK_TARGET_SLOT=0
    -Wformat                ; arm printf-format checking (c1cat/_F attribute, v2 String pass)
    -I$PROJECT_DIR/include  ; Add include directory to library search path
extra_scripts = 
    pre:scripts/generate_version.py
    pre:scripts/add_flash_nvm_guard.py
    post:scripts/generate_joint_config.py

[env:pico2_debug]
extends = env:pico2
build_flags =
    -DCONTROLLER_DEBUG=1 
    -DLOG_LEVEL=3
    -DFW_LINK_TARGET_SLOT=0
    -Wformat
    -I$PROJECT_DIR/include

[env:pico2_debug_rev_d]
extends = env:pico2_debug
build_flags =
    ${env:pico2_debug.build_flags}
    -DSAFETY_BOARD_REV_D

; --- solid-400Hz bench ladder (2026-07-06): one variable per step ------------------
; rev_d (control, flash-exec) -> _ram (+hot path in RAM) -> _ll2 (+LOG_LEVEL=2)
; -> _oc200 (+200MHz). Flags re-listed from scratch (NOT interpolated) so a single
; -DLOG_LEVEL lands on the command line.

[env:pico2_debug_rev_d_ram]
extends = env:pico2_debug_rev_d
build_flags =
    -DCONTROLLER_DEBUG=1
    -DLOG_LEVEL=3
    -DFW_LINK_TARGET_SLOT=0
    -Wformat
    -I$PROJECT_DIR/include
    -DSAFETY_BOARD_REV_D
    -DHOT_PATH_IN_RAM=1

[env:pico2_debug_rev_d_ll2]
extends = env:pico2_debug_rev_d
build_flags =
    -DCONTROLLER_DEBUG=1
    -DLOG_LEVEL=2
    -DFW_LINK_TARGET_SLOT=0
    -Wformat
    -I$PROJECT_DIR/include
    -DSAFETY_BOARD_REV_D
    -DHOT_PATH_IN_RAM=1

[env:pico2_debug_rev_d_oc200]
extends = env:pico2_debug_rev_d_ll2
board_build.f_cpu = 200000000L

[env:pico2_debug_host1m]
extends = env:pico2_debug
build_flags =
    ${env:pico2_debug.build_flags}
    -DHOST_CAN_MCP_BITRATE=CAN_1000KBPS
    -DHOST_CAN_BITRATE_KBPS=1000

[env:pico2_debug_crosschip_host1m]
extends = env:pico2_debug_host1m
build_flags =
    ${env:pico2_debug_host1m.build_flags}
    -DCAN_CROSS_CHIP_TEST
    -DCAN_CROSS_CHIP_STRESS_FRAMES=1024
    -DCAN_CROSS_CHIP_RX_TIMEOUT_MS=10
    -DCAN_CROSS_CHIP_PROGRESS_INTERVAL=128

[env:pico2_boot_update]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
custom_flash_link_target = boot_update
build_src_filter =
    -<*>
    +<boot_update/>
build_flags =
    -DNO_USB
    -DLOG_LEVEL=0
    -DFW_LINK_TARGET_SLOT=0
    -I$PROJECT_DIR/include
extra_scripts =
    pre:scripts/generate_version.py
    pre:scripts/add_flash_nvm_guard.py

[env:pico2_boot_update_debug]
extends = env:pico2_boot_update
build_flags =
    -DNO_USB
    -DLOG_LEVEL=3
    -DFW_LINK_TARGET_SLOT=0
    -I$PROJECT_DIR/include

[env:pico2_slot_a]
extends = env:pico2
custom_flash_link_target = slot_a
build_flags =
    -DCONTROLLER_DEBUG=0
    -DLOG_LEVEL=2
    -DFW_LINK_TARGET_SLOT=1
    -I$PROJECT_DIR/include

[env:pico2_slot_a_debug]
extends = env:pico2_slot_a
build_flags =
    -DCONTROLLER_DEBUG=1
    -DLOG_LEVEL=3
    -DFW_LINK_TARGET_SLOT=1
    -I$PROJECT_DIR/include

[env:pico2_slot_b]
extends = env:pico2
custom_flash_link_target = slot_b
build_flags =
    -DCONTROLLER_DEBUG=0
    -DLOG_LEVEL=2
    -DFW_LINK_TARGET_SLOT=2
    -I$PROJECT_DIR/include

[env:pico2_slot_b_debug]
extends = env:pico2_slot_b
build_flags =
    -DCONTROLLER_DEBUG=1
    -DLOG_LEVEL=3
    -DFW_LINK_TARGET_SLOT=2
    -I$PROJECT_DIR/include
